[project]
name = "reurb-api"
version = "0.1.0"
description = "API do REURB Livre (FastAPI + PostGIS)"
license = "AGPL-3.0-or-later"
authors = [
    { name = "darlanmnunes", email = "45981692+darlanmnunes@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "pyproj>=3.8.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.33",
    "shapely>=2.2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
reurb-api = "reurb_api:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B905"]
